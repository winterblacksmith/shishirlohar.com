name: Deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 23 * * 1-5"

concurrency:
  group: portfolio-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Refresh completed daily market data
        run: npm run refresh:data

      - name: Validate website
        run: npm run check

      - name: Check deployment configuration
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"

      - name: Configure deployment SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Package tracked site
        run: |
          mkdir release
          git archive --format=tar HEAD:dist | tar -xf - -C release
          cp dist/assets/quant/spy.json release/assets/quant/spy.json
          python3 scripts/version-assets.py release
          tar -cf portfolio.tar -C release .
          echo "RELEASE_ID=$(sha256sum portfolio.tar | cut -c1-40)" >> "$GITHUB_ENV"

      - name: Upload release
        run: scp -i ~/.ssh/deploy_key portfolio.tar "$DEPLOY_USER@$DEPLOY_HOST:incoming/portfolio.tar"

      - name: Activate release
        run: |
          revision="$RELEASE_ID"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            sudo /usr/local/sbin/deploy-shishirlohar "$revision"

      - name: Verify production
        run: curl --fail --silent --show-error --retry 5 --retry-delay 2 https://shishirlohar.com/health
