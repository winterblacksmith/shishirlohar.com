name: Deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "30 23 * * 1-5"

concurrency:
  group: portfolio-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    # Standard runners are free for public repositories. Skip before allocating
    # a runner if visibility changes, rather than consuming billable private minutes.
    if: github.ref == 'refs/heads/main' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Read the tested Atlas release
        id: atlas
        run: |
          python3 - <<'PYCODE' >> "$GITHUB_OUTPUT"
          import json, re
          lock = json.load(open('atlas-quant.lock.json'))
          assert lock['repository'] == 'winterblacksmith/atlas-quant'
          assert re.fullmatch(r'[0-9a-f]{40}', lock['revision'])
          print('revision=' + lock['revision'])
          PYCODE

      - name: Check out the pinned Atlas repository
        uses: actions/checkout@v4
        with:
          repository: winterblacksmith/atlas-quant
          ref: ${{ steps.atlas.outputs.revision }}
          path: .atlas-source
          persist-credentials: false

      - name: Refresh completed daily market data
        working-directory: .atlas-source
        run: npm run refresh:data

      - name: Validate Atlas
        working-directory: .atlas-source
        run: npm run check

      - name: Assemble the Atlas preview for link checks
        run: python3 scripts/assemble-atlas.py

      - name: Validate website
        run: npm run check

      - name: Check deployment configuration
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"

      - name: Configure deployment SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Package tracked site
        run: |
          mkdir release
          git archive --format=tar HEAD:dist | tar -xf - -C release
          python3 scripts/assemble-atlas.py --output release
          python3 scripts/version-assets.py release
          tar -cf portfolio.tar -C release .
          echo "RELEASE_ID=$(sha256sum portfolio.tar | cut -c1-40)" >> "$GITHUB_ENV"

      - name: Upload release
        run: scp -i ~/.ssh/deploy_key portfolio.tar "$DEPLOY_USER@$DEPLOY_HOST:incoming/portfolio.tar"

      - name: Activate release
        run: |
          revision="$RELEASE_ID"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            sudo /usr/local/sbin/deploy-shishirlohar "$revision"

      - name: Verify production
        run: curl --fail --silent --show-error --retry 5 --retry-delay 2 https://shishirlohar.com/health
