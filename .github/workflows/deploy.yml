name: Deploy portfolio

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: portfolio-production
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate website
        run: npm run check

      - name: Check deployment configuration
        run: |
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"

      - name: Configure deployment SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Package tracked site
        run: git archive --format=tar HEAD:dist > portfolio.tar

      - name: Upload release
        run: scp -i ~/.ssh/deploy_key portfolio.tar "$DEPLOY_USER@$DEPLOY_HOST:incoming/portfolio.tar"

      - name: Activate release
        run: |
          revision="$(git rev-parse --short HEAD)"
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" \
            sudo /usr/local/sbin/deploy-shishirlohar "$revision"

      - name: Verify production
        run: curl --fail --silent --show-error --retry 5 --retry-delay 2 https://shishirlohar.com/health
