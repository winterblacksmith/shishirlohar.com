# Optional virtual host for the DS edition. Install only after DNS and TLS setup.
server {
    listen 80;
    server_name ds.shishirlohar.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ds.shishirlohar.com;
    root /var/www/shishirlohar.com/current/ds;
    index index.html;
    ssl_certificate /etc/letsencrypt/live/ds.shishirlohar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ds.shishirlohar.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    location /assets/ { root /var/www/shishirlohar.com/current; }
    location / { try_files $uri $uri/ =404; }
}
