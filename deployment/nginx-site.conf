server {
    listen 80;
    server_name shishirlohar.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name shishirlohar.com;
    root /var/www/shishirlohar.com/current;
    index index.html;
    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/shishirlohar.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/shishirlohar.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;
    gzip on;
    gzip_types text/css application/javascript application/xml image/svg+xml;
    location = /health { access_log off; default_type text/plain; return 200 'ok'; }
    location / { try_files $uri $uri/ =404; }
    error_page 404 /404.html;
}
